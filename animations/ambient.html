<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambient Plaza</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: grid; place-items: center; overflow: hidden; }
  #stage { position: relative; width: min(100vw, calc(100vh * 1985 / 1117)); aspect-ratio: 1985 / 1117; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
</div>
<script>
/* Ambient photo (Figma 466:19631) — 1985 × 1117
 *
 * People: the photo is drawn through a WebGL "puppet warp". Each body part is a
 * soft capsule mask that rotates around a pivot (shoulder, neck, feet…) and/or
 * translates by a few pixels. Displacements of overlapping parts add up, so an
 * arm rides along with the torso it belongs to. Everyone stays in place; only
 * heads, hair, arms and torsos move.
 *
 * Leaves: a 2D canvas on top, spawning leaves at random that tumble and drift down.
 *
 * Everything repeats exactly every LOOP seconds, so a video export loops seamlessly.
 *
 * ?debug   → outline every body-part mask
 * ?t=2.5   → freeze at that time
 * ?render  → no playback; window.capture(t) returns one frame as PNG (used for MP4 export)
 */
const W = 1985, H = 1117;
const QS = new URLSearchParams(location.search);
const DEBUG = QS.has("debug");
const STILL = QS.has("t") ? parseFloat(QS.get("t")) : null;   // ?t=2.5 → freeze at that time
const RENDER = QS.has("render");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- motion helpers ----------
const TAU = Math.PI * 2;
const LOOP = 18;                                    // seconds; every motion repeats on this cycle
// snap an angular speed (rad/s) to a whole number of cycles per LOOP so the motion loops cleanly
const q = w => Math.max(1, Math.round(w * LOOP / TAU)) * TAU / LOOP;
const s = (t, hz, ph = 0) => Math.sin(q(TAU * hz) * t + ph);
// smooth pseudo-random wobble (sum of sines), roughly in [-1, 1]; rate speeds it up / slows it down
const wob = (t, seed, rate = 1) => (Math.sin(q(1.31 * rate) * t + seed) + Math.sin(q(2.17 * rate) * t + seed * 1.7) * 0.6 + Math.sin(q(0.53 * rate) * t + seed * 3.1) * 0.8) / 2.4;
// "talking" envelope: bursts of quick movement separated by pauses
const talk = (t, seed, rate = 1) => Math.max(0, Math.sin(q(0.9 * rate) * t + seed)) * Math.sin(q(TAU * 3.2 * rate) * t + seed) * (0.6 + 0.4 * Math.sin(q(TAU * 0.7 * rate) * t + seed * 2));

// posture keyframes for the woman taking a photo, looping every SHOT_LOOP seconds
// values: [body lean, arm angle, arm lift (px, − is up), head tilt]
const SHOT_LOOP = 9;
const SHOT_KEYS = [
  [0.0, [0, 0, 0, 0]],
  [1.6, [0, 0, 0, 0]],                          // holding still
  [2.5, [-0.016, 0.07, -4, 0.06]],              // leans back, lifts the phone higher
  [4.2, [-0.016, 0.07, -4, 0.06]],
  [5.1, [0.012, -0.05, -1.5, -0.05]],           // leans the other way, angles the phone
  [6.8, [0.012, -0.05, -1.5, -0.05]],
  [7.8, [0, 0, 0, 0]],                          // settles back
  [SHOT_LOOP, [0, 0, 0, 0]],
];
const easeIO = x => x * x * (3 - 2 * x);
function shot(t) {
  const u = ((t % SHOT_LOOP) + SHOT_LOOP) % SHOT_LOOP;
  let i = 0;
  while (i < SHOT_KEYS.length - 2 && u >= SHOT_KEYS[i + 1][0]) i++;
  const [t0, v0] = SHOT_KEYS[i], [t1, v1] = SHOT_KEYS[i + 1];
  const k = easeIO(Math.min(1, Math.max(0, (u - t0) / (t1 - t0))));
  return v0.map((v, j) => v + (v1[j] - v) * k);
}

// ---------- body parts ----------
// a, b: capsule segment · r: radius · f: soft edge · c: pivot
// m(t) → [angle (rad), dx, dy]
const parts = [
  // ── man in the striped jumper: idle, small movements only ──
  // tight masks with short feathers so the mic stand and background stay put
  { a: [628, 515], b: [628, 585], r: 30, f: 8, c: [628, 640],
    m: t => [0.006 * s(t, 0.2), 0, 0.6 * s(t, 0.25)] },                              // breathing / weight shift
  { a: [630, 494], b: [630, 508], r: 18, f: 6, c: [629, 522],
    m: t => [0.04 * wob(t, 21, 0.5), 0, 0] },                                       // head looking around
  { a: [654, 526], b: [672, 543], r: 12, f: 6, c: [652, 524],
    m: t => [0.025 * s(t, 0.35, 0.3), 0, 0] },                                       // right arm, slight

  // ── woman on the bench: hands still, only her head moves ──
  { a: [733, 645], b: [734, 662], r: 19, f: 8, c: [736, 684],
    m: t => [0.06 * wob(t, 23, 0.6) + 0.04 * talk(t, 23), 0, 0.8 * talk(t, 24)] },  // head: chatting, nodding
  { a: [744, 668], b: [752, 755], r: 16, f: 8, c: [736, 664],
    m: t => [0.6 * (0.06 * wob(t - 0.42, 23, 0.6) + 0.04 * talk(t - 0.15, 23)), 0, 0] }, // hair follows the head

  // ── man on the bench (chatting) ──
  { a: [870, 660], b: [870, 740], r: 48, f: 24, c: [870, 780],
    m: t => [0.008 * wob(t, 4), 0, 1.0 * s(t, 0.25)] },                              // breathing / shift
  { a: [833, 612], b: [838, 640], r: 23, f: 12, c: [846, 652],
    m: t => [0.05 * wob(t, 1, 0.8) + 0.045 * talk(t, 1), 0, 1.2 * talk(t, 1.4)] },  // nodding while talking
  { a: [824, 636], b: [826, 642], r: 6, f: 5, c: [828, 634],
    m: t => [0, 0, 0.9 * Math.abs(talk(t, 2, 1.6))] },                              // jaw

  // ── woman taking a photo: shifts her posture to get the shot ──
  // body lean (pivot at her feet) carries the arms and head along with it
  { a: [1045, 545], b: [1045, 700], r: 40, f: 14, c: [1045, 790],
    m: t => [shot(t)[0] + 0.002 * wob(t, 7), 0, 0] },                                // lean
  { a: [1047, 520], b: [1047, 545], r: 15, f: 6, c: [1046, 562],
    m: t => [shot(t)[3], 0, 0] },                                                    // head tilts to check the frame
  { a: [1007, 568], b: [1016, 530], r: 17, f: 10, c: [1032, 574],
    m: t => [shot(t)[1] + 0.006 * wob(t, 5, 1.3), 0, shot(t)[2]] },                 // arms raise / angle the phone

  // ── worker in hi-vis ──
  { a: [1190, 470], b: [1190, 560], r: 30, f: 18, c: [1190, 635],
    m: t => [0.008 * s(t, 0.22, 1), 0, 0.7 * s(t, 0.25, 1)] },                       // breathing
  { a: [1193, 446], b: [1195, 462], r: 17, f: 10, c: [1196, 472],
    m: t => [0.07 * wob(t, 9, 0.45) + 0.03 * talk(t, 9), 0, 0] },                   // looking around
  { a: [1176, 480], b: [1174, 540], r: 11, f: 9, c: [1177, 478],
    m: t => [0.05 * s(t, 0.5, 2), 0, 0] },                                           // arm swing

  // ── vendor behind the cart ──
  { a: [1212, 412], b: [1212, 428], r: 14, f: 8, c: [1212, 440],
    m: t => [0.06 * wob(t, 11, 0.7) + 0.05 * talk(t, 6), 0, 0] },

  // ── man at the right stall ──
  { a: [1870, 500], b: [1875, 600], r: 42, f: 22, c: [1875, 680],
    m: t => [0.012 * s(t, 0.15, 3), 0, 0] },                                         // leaning
  { a: [1881, 485], b: [1883, 502], r: 19, f: 11, c: [1880, 516],
    m: t => [0.06 * wob(t, 13, 0.5) + 0.04 * talk(t, 13), 0, 0] },                  // browsing / chatting
  { a: [1872, 540], b: [1886, 586], r: 12, f: 10, c: [1866, 525],
    m: t => [0.06 * wob(t, 17, 0.8), 0, 0] },                                       // hand at the stall

  // ── person at the trailer stall ──
  { a: [1602, 445], b: [1602, 458], r: 13, f: 8, c: [1602, 470],
    m: t => [0.06 * wob(t, 19, 0.6), 0, 0] },
];
const N = parts.length;

// ---------- WebGL warp ----------
const glc = document.getElementById("gl");
const gl = glc.getContext("webgl", { premultipliedAlpha: false, antialias: false });
const VS = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0., 1.); }`;
const FS = `precision highp float;
varying vec2 uv;
uniform sampler2D img;
uniform vec2 size;
uniform int count;
uniform vec4 seg[${N}];   // a.xy b.xy
uniform vec4 par[${N}];   // r, feather, pivot.xy
uniform vec4 xf[${N}];    // angle, dx, dy
void main(){
  vec2 p = uv * size, d = vec2(0.);
  for (int i = 0; i < ${N}; i++) {
    if (i >= count) break;
    vec2 a = seg[i].xy, ab = seg[i].zw - a;
    float h = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-4), 0., 1.);
    float w = 1. - smoothstep(par[i].x, par[i].x + par[i].y, length(p - a - ab * h));
    if (w <= 0.) continue;
    vec2 c = par[i].zw, q = p - c - xf[i].yz;
    float cs = cos(xf[i].x), sn = sin(xf[i].x);
    vec2 src = c + vec2(cs * q.x + sn * q.y, -sn * q.x + cs * q.y);   // inverse rotation
    d += w * (src - p);
  }
  gl_FragColor = texture2D(img, (p + d) / size);
}`;
function shader(type, src) {
  const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(sh);
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
gl.uniform2f(U("size"), W, H);
gl.uniform1i(U("count"), N);
gl.uniform4fv(U("seg"), parts.flatMap(p => [...p.a, ...p.b]));
gl.uniform4fv(U("par"), parts.flatMap(p => [p.r, p.f, ...p.c]));
const uXf = U("xf");
const xfBuf = new Float32Array(N * 4);

// The photo is embedded as a data URI (see the PHOTO script at the end of the file).
// Browsers block WebGL from reading a plain "ambient.jpg" when the page is opened
// straight from disk (file://), which left only the leaves visible.
const img = new Image();
addEventListener("DOMContentLoaded", () => { img.src = window.PHOTO || "ambient.jpg"; });
let ready = false;
img.onload = () => {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  ready = true;
};

// ---------- leaves ----------
const fx = document.getElementById("fx");
const ctx = fx.getContext("2d");
const LEAF_COLORS = ["#d9a441", "#c98a2b", "#e3b65c", "#a8652a", "#b5482b", "#8f9a3e", "#c46f2c", "#9c7a2e"];
// seeded random so every run (and every exported frame) gets the same leaves
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rand = (a, b) => a + rnd() * (b - a);

// Each slot releases one leaf every LOOP seconds at its own offset. A leaf can take
// longer than LOOP to fall, so several releases of one slot can be in the air at once.
const LEAF_SLOTS = 14;
const slots = Array.from({ length: LEAF_SLOTS }, (_, i) => {
  const z = Math.pow(rnd(), 1.6);                      // depth: 0 far … 1 near (most leaves are far)
  return {
    offset: (i + rand(0, 0.8)) * LOOP / LEAF_SLOTS,
    // trees sit mostly on the right and behind the plaza; bias the release points there
    x0: rnd() < 0.6 ? rand(W * 0.45, W * 1.05) : rand(-W * 0.05, W * 0.55),
    z, size: 11 + z * 34,                              // px in image space
    vy: 22 + z * 55 + rand(-6, 6),                     // fall speed px/s
    drift: rand(-14, -2) * (0.5 + z),                  // light breeze to the left
    swayA: rand(10, 36) * (0.5 + z), swayF: rand(0.25, 0.6), swayP: rand(0, TAU),
    spin0: rand(0, TAU), spinV: rand(-1.4, 1.4),
    flipF: rand(0.5, 1.6), flipP: rand(0, TAU),
    color: LEAF_COLORS[(rnd() * LEAF_COLORS.length) | 0],
    shape: rand(0.38, 0.55),                           // width / length
    alpha: 0.55 + z * 0.45,
  };
}).sort((a, b) => a.z - b.z);                          // far leaves drawn first

// every leaf in the air at time t, as { L, age }
function leavesAt(t) {
  const out = [];
  for (const L of slots) {
    const life = (H + 140) / L.vy;
    const base = (((t - L.offset) % LOOP) + LOOP) % LOOP;
    for (let age = base; age < life; age += LOOP) {
      if (L.x0 + L.drift * age < -140) break;
      out.push({ L, age });
    }
  }
  return out;
}

function drawLeaf(L, age, scale) {
  const sway = Math.sin(TAU * L.swayF * age + L.swayP);
  const x = (L.x0 + L.drift * age + sway * L.swayA) * scale, y = (-60 + L.vy * age) * scale;
  const flip = Math.cos(TAU * L.flipF * age + L.flipP);          // tumbling: leaf turns edge-on
  const len = L.size * scale, wid = len * L.shape;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(L.spin0 + L.spinV * age + sway * 0.6);
  ctx.scale(Math.max(Math.abs(flip), 0.08) * Math.sign(flip || 1), 1);
  ctx.globalAlpha = L.alpha;
  // body
  ctx.beginPath();
  ctx.moveTo(0, -len / 2);
  ctx.bezierCurveTo(wid, -len * 0.25, wid * 0.8, len * 0.3, 0, len / 2);
  ctx.bezierCurveTo(-wid * 0.8, len * 0.3, -wid, -len * 0.25, 0, -len / 2);
  ctx.fillStyle = L.color;
  ctx.fill();
  // sunlit side when the leaf faces the low sun, shade when it turns away
  ctx.globalAlpha = L.alpha * (flip > 0 ? 0.28 * flip : 0.35 * -flip);
  ctx.fillStyle = flip > 0 ? "#fff1c9" : "#2a1a08";
  ctx.fill();
  // midrib + stem
  ctx.globalAlpha = L.alpha * 0.55;
  ctx.strokeStyle = "rgba(70,40,10,.8)";
  ctx.lineWidth = Math.max(0.6, len * 0.035);
  ctx.beginPath(); ctx.moveTo(0, -len / 2 + len * 0.08); ctx.lineTo(0, len / 2 + len * 0.12); ctx.stroke();
  ctx.restore();
}

// ---------- sizing ----------
function resize() {
  const r = glc.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  for (const c of [glc, fx]) if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  gl.viewport(0, 0, w, h);
}
addEventListener("resize", resize);
resize();

// ---------- draw ----------
function draw(t) {
  if (ready) {
    parts.forEach((p, i) => { const [ang, dx, dy] = p.m(t); xfBuf.set([ang, dx, dy, 0], i * 4); });
    gl.uniform4fv(uXf, xfBuf);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  const scale = fx.width / W;
  ctx.clearRect(0, 0, fx.width, fx.height);
  for (const { L, age } of leavesAt(t)) drawLeaf(L, age, scale);

  if (DEBUG) {
    ctx.save(); ctx.scale(scale, scale); ctx.lineWidth = 1.5 / scale;
    for (const p of parts) {
      ctx.strokeStyle = "rgba(255,0,80,.9)";
      ctx.beginPath(); ctx.lineCap = "round";
      ctx.lineWidth = p.r * 2; ctx.globalAlpha = 0.18;
      ctx.moveTo(...p.a); ctx.lineTo(...p.b); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = "#0ff";
      ctx.fillRect(p.c[0] - 2, p.c[1] - 2, 4, 4);
    }
    ctx.restore();
  }

}

// ---------- playback / export ----------
const t0 = performance.now();
function frame(now) {
  draw(STILL ?? (now - t0) / 1000);
  if (!REDUCED && (STILL === null || !ready)) requestAnimationFrame(frame);
}
if (RENDER) {
  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  const octx = out.getContext("2d");
  window.capture = t => {
    draw(t);
    octx.drawImage(glc, 0, 0, W, H);
    octx.drawImage(fx, 0, 0, W, H);
    return out.toDataURL("image/png");
  };
  window.ambient = { LOOP, get ready() { return ready; } };
} else if (REDUCED) img.addEventListener("load", () => requestAnimationFrame(frame));
else requestAnimationFrame(frame);
